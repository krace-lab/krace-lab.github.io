
<h2 class="sr-only">目黒記念過去27年データダッシュボード。直近10年と全27年を切り替えて比較できます。</h2>
<script async src="https://www.googletagmanager.com/gtag/js?id=G-4J7XM5HT7V"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-4J7XM5HT7V');

<style>
.toggle-wrap{display:flex;gap:8px;margin-bottom:1.5rem}
.tog{padding:6px 16px;border:0.5px solid var(--color-border-secondary);border-radius:var(--border-radius-md);background:transparent;color:var(--color-text-secondary);cursor:pointer;font-size:13px;transition:all .15s}
.tog.active{background:var(--color-background-secondary);color:var(--color-text-primary);border-color:var(--color-border-primary);font-weight:500}
.section-label{font-size:11px;color:var(--color-text-tertiary);text-transform:uppercase;letter-spacing:.06em;margin:1.5rem 0 .75rem}
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:1.5rem}
.kpi{background:var(--color-background-secondary);border-radius:var(--border-radius-md);padding:.875rem 1rem}
.kpi-label{font-size:12px;color:var(--color-text-secondary);margin-bottom:4px}
.kpi-val{font-size:22px;font-weight:500;color:var(--color-text-primary)}
.kpi-sub{font-size:11px;color:var(--color-text-tertiary);margin-top:2px}
.charts-row{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:1.5rem}
.chart-card{background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);padding:1rem}
.chart-title{font-size:13px;font-weight:500;color:var(--color-text-secondary);margin-bottom:12px}
.chart-wrap{position:relative}
.note-bar{font-size:11px;color:var(--color-text-tertiary);border-top:0.5px solid var(--color-border-tertiary);padding-top:.75rem;margin-top:1rem}
.badge{display:inline-block;font-size:11px;padding:2px 8px;border-radius:var(--border-radius-md);margin-right:4px;margin-bottom:4px}
.badge-warn{background:var(--color-background-warning);color:var(--color-text-warning)}
.badge-info{background:var(--color-background-info);color:var(--color-text-info)}
.badge-success{background:var(--color-background-success);color:var(--color-text-success)}
.badge-danger{background:var(--color-background-danger);color:var(--color-text-danger)}
.insight-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.insight-card{background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);padding:.875rem 1rem}
.insight-title{font-size:12px;font-weight:500;color:var(--color-text-secondary);margin-bottom:8px}
.insight-row{display:flex;justify-content:space-between;align-items:center;font-size:13px;padding:3px 0;border-bottom:0.5px solid var(--color-border-tertiary)}
.insight-row:last-child{border-bottom:none}
.insight-key{color:var(--color-text-secondary)}
.insight-val{font-weight:500;color:var(--color-text-primary)}
.bar-row{display:flex;align-items:center;gap:8px;margin-bottom:5px;font-size:12px}
.bar-label{width:56px;color:var(--color-text-secondary);text-align:right;flex-shrink:0}
.bar-track{flex:1;background:var(--color-background-secondary);border-radius:2px;height:8px;overflow:hidden}
.bar-fill{height:100%;border-radius:2px;transition:width .3s}
.bar-num{width:28px;color:var(--color-text-secondary);font-size:11px}
.ref-line{font-size:11px;color:var(--color-text-tertiary);margin-top:6px}
</style>

<div style="padding:1rem 0 0">

<div class="toggle-wrap">
  <button class="tog active" onclick="setMode('10')">直近10年</button>
  <button class="tog" onclick="setMode('27')">全27年（参考）</button>
</div>

<div id="kpi-area" class="kpi-grid"></div>

<p class="section-label">枠番 / 脚質</p>
<div class="charts-row">
  <div class="chart-card">
    <div class="chart-title">枠番別 複勝率</div>
    <div id="waku-bars"></div>
  </div>
  <div class="chart-card">
    <div class="chart-title">脚質別 着度数</div>
    <div class="chart-wrap" style="height:160px"><canvas id="kyakushitsu-chart" role="img" aria-label="脚質別着度数棒グラフ">逃げ・先行・差し・追込の着度数比較</canvas></div>
  </div>
</div>

<p class="section-label">人気 / 年齢</p>
<div class="charts-row">
  <div class="chart-card">
    <div class="chart-title">人気別 複勝率</div>
    <div class="chart-wrap" style="height:160px"><canvas id="ninki-chart" role="img" aria-label="人気別複勝率グラフ">1〜6番人気以下の複勝率比較</canvas></div>
  </div>
  <div class="chart-card">
    <div class="chart-title">馬齢別 好走度</div>
    <div class="chart-wrap" style="height:160px"><canvas id="barei-chart" role="img" aria-label="馬齢別複勝率グラフ">3〜9歳の複勝率比較</canvas></div>
  </div>
</div>

<p class="section-label">構造サマリー</p>
<div class="insight-grid">
  <div class="insight-card">
    <div class="insight-title">注目ポイント（直近10年）</div>
    <div id="note-badges"></div>
  </div>
  <div class="insight-card">
    <div class="insight-title">人気別ワンポイント</div>
    <div id="ninki-notes"></div>
  </div>
</div>

<div class="note-bar" id="mode-note">※ 直近10年データ（2016〜2025）</div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script>
const DATA = {
  '10': {
    label:'直近10年（2016〜2025）',
    ninki: {
      labels:['1人気','2人気','3人気','4人気','5人気','6人気↓'],
      win:   [4,2,3,1,0,3],
      place: [7,4,5,2,2,11],
      total: [10,10,10,10,10,83]
    },
    waku: {
      labels:['1枠','2枠','3枠','4枠','5枠','6枠','7枠','8枠'],
      place: [3,2,2,7,8,4,3,5],
      total: [18,18,19,19,20,20,25,27]
    },
    kyaku: {
      labels:['逃げ','先行','差し','追込'],
      w:[1,3,4,4], p2:[1,4,5,2], p3:[1,3,5,1]
    },
    barei: {
      labels:['4歳','5歳','6歳','7歳','8歳'],
      w:[5,3,5,0,0],
      total:[28,34,30,22,10]
    },
    kpi: {
      avg3tan: '約6.5万円',
      avg3fuku: '約1.2万円',
      cote: 'Cコース',
      pace: 'スロー→ロンスパ'
    }
  },
  '27': {
    label:'全27年（1999〜2025）',
    ninki: {
      labels:['1人気','2人気','3人気','4人気','5人気','6人気↓'],
      win:   [7,2,6,2,1,9],
      place: [16,9,9,5,6,36],
      total: [27,27,27,27,27,313]
    },
    waku: {
      labels:['1枠','2枠','3枠','4枠','5枠','6枠','7枠','8枠'],
      place: [10,10,9,13,14,8,8,9],
      total: [48,49,49,52,54,54,70,72]
    },
    kyaku: {
      labels:['逃げ','先行','差し','追込'],
      w:[3,7,9,8], p2:[3,8,11,5], p3:[3,8,14,2]
    },
    barei: {
      labels:['4歳','5歳','6歳','7歳','8歳'],
      w:[8,6,9,3,1],
      total:[104,117,109,67,34]
    },
    kpi: {
      avg3tan: '約30万円超',
      avg3fuku: '約3万円',
      cote: 'B→Cコース移行あり',
      pace: '時代で変化'
    }
  }
};

let charts = {};
let currentMode = '10';

function pct(n,d){ return d===0?0:Math.round(n/d*100); }

function setMode(m){
  currentMode = m;
  document.querySelectorAll('.tog').forEach(b=>b.classList.toggle('active', b.textContent.includes(m==='10'?'直近':'全')));
  renderAll();
}

function renderAll(){
  const d = DATA[currentMode];
  renderKPI(d);
  renderWaku(d);
  renderKyaku(d);
  renderNinki(d);
  renderBarei(d);
  renderNotes(d);
  document.getElementById('mode-note').textContent = '※ ' + d.label;
}

function renderKPI(d){
  const n = d.ninki;
  const tot1 = n.total[0];
  const fuku1 = pct(n.place[0],tot1);
  const win1 = pct(n.win[0],tot1);
  const lowPop = n.place.slice(5).reduce((a,b)=>a+b,0);
  const lowTot = n.total.slice(5).reduce((a,b)=>a+b,0);
  document.getElementById('kpi-area').innerHTML = `
    <div class="kpi"><div class="kpi-label">1番人気 勝率/複勝率</div><div class="kpi-val">${win1}% / ${fuku1}%</div><div class="kpi-sub">勝ちきれない傾向</div></div>
    <div class="kpi"><div class="kpi-label">6人気↓ 複勝率</div><div class="kpi-val">${pct(lowPop,lowTot)}%</div><div class="kpi-sub">毎年穴が来る</div></div>
    <div class="kpi"><div class="kpi-label">コース</div><div class="kpi-val" style="font-size:15px">${d.kpi.cote}</div><div class="kpi-sub">内有利が基本</div></div>
    <div class="kpi"><div class="kpi-label">ペース型</div><div class="kpi-val" style="font-size:15px">${d.kpi.pace}</div><div class="kpi-sub">上がり勝負</div></div>
  `;
}

function renderWaku(d){
  const w = d.waku;
  const max = Math.max(...w.place.map((p,i)=>pct(p,w.total[i])));
  const colors = ['#888780','#888780','#888780','#3266ad','#3266ad','#888780','#c94c3a','#888780'];
  let html = '';
  w.labels.forEach((lb,i)=>{
    const p = pct(w.place[i],w.total[i]);
    const fill = Math.round(p/max*100);
    html += `<div class="bar-row"><div class="bar-label">${lb}</div><div class="bar-track"><div class="bar-fill" style="width:${fill}%;background:${colors[i]}"></div></div><div class="bar-num">${p}%</div></div>`;
  });
  html += `<div class="ref-line">青=好走ゾーン　赤=不振枠</div>`;
  document.getElementById('waku-bars').innerHTML = html;
}

function destroyChart(id){
  if(charts[id]){ charts[id].destroy(); delete charts[id]; }
}

function renderKyaku(d){
  destroyChart('kyaku');
  const k = d.kyaku;
  charts['kyaku'] = new Chart(document.getElementById('kyakushitsu-chart'),{
    type:'bar',
    data:{
      labels:k.labels,
      datasets:[
        {label:'1着',data:k.w,backgroundColor:'#3266ad',borderWidth:0},
        {label:'2着',data:k.p2,backgroundColor:'#7fa8d8',borderWidth:0},
        {label:'3着',data:k.p3,backgroundColor:'#c0d7ef',borderWidth:0}
      ]
    },
    options:{responsive:true,maintainAspectRatio:false,
      plugins:{legend:{display:false}},
      scales:{x:{stacked:true,ticks:{color:'#888',font:{size:11}}},y:{stacked:true,ticks:{color:'#888',font:{size:11}},grid:{color:'rgba(128,128,128,.1)'}}}
    }
  });
}

function renderNinki(d){
  destroyChart('ninki');
  const n = d.ninki;
  const rates = n.place.map((p,i)=>pct(p,n.total[i]));
  const colors = rates.map((_,i)=> i===2 ? '#c94c3a' : '#3266ad');
  charts['ninki'] = new Chart(document.getElementById('ninki-chart'),{
    type:'bar',
    data:{labels:n.labels,datasets:[{data:rates,backgroundColor:colors,borderWidth:0}]},
    options:{responsive:true,maintainAspectRatio:false,
      plugins:{legend:{display:false}},
      scales:{
        x:{ticks:{color:'#888',font:{size:11}},grid:{display:false}},
        y:{ticks:{color:'#888',font:{size:11},callback:v=>v+'%'},grid:{color:'rgba(128,128,128,.1)'},max:100}
      }
    }
  });
}

function renderBarei(d){
  destroyChart('barei');
  const b = d.barei;
  const rates = b.w.map((w,i)=>pct(w,b.total[i]));
  charts['barei'] = new Chart(document.getElementById('barei-chart'),{
    type:'bar',
    data:{labels:b.labels,datasets:[{data:rates,backgroundColor:'#5caa82',borderWidth:0}]},
    options:{responsive:true,maintainAspectRatio:false,
      plugins:{legend:{display:false}},
      scales:{
        x:{ticks:{color:'#888',font:{size:11}},grid:{display:false}},
        y:{ticks:{color:'#888',font:{size:11},callback:v=>v+'%'},grid:{color:'rgba(128,128,128,.1)'},max:30}
      }
    }
  });
}

function renderNotes(d){
  const badges = [
    ['info','スロー→ロンスパ固定'],
    ['success','4〜6枠が好走ゾーン'],
    ['danger','7枠は壊滅的'],
    ['warn','3人気は複勝率最低'],
    ['info','差し〜追込が優位'],
    ['success','6〜10人気から毎年1頭'],
  ];
  document.getElementById('note-badges').innerHTML = badges.map(([t,l])=>`<span class="badge badge-${t}">${l}</span>`).join('');

  const rows27 = currentMode==='27'?[
    ['コース変遷','Bコース時代あり'],
    ['ペース','年代で大きく差'],
    ['血統主流','SS系確立前後で異なる'],
  ]:[];

  const ninkiData = d.ninki;
  const notes = ninkiData.labels.map((lb,i)=>{
    const p = pct(ninkiData.place[i],ninkiData.total[i]);
    const w = pct(ninkiData.win[i],ninkiData.total[i]);
    return `<div class="insight-row"><div class="insight-key">${lb}</div><div class="insight-val">勝率${w}% / 複${p}%</div></div>`;
  });
  document.getElementById('ninki-notes').innerHTML = notes.join('') +
    (currentMode==='27'?'<div style="font-size:11px;color:var(--color-text-tertiary);margin-top:6px">※全27年は傾向が分散</div>':'');
}

renderAll();
</script>
